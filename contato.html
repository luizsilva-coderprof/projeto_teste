<!DOCTYPE html>
<html lang="pt-br">
<head>
     <meta charset="UTF-8">
    <title>Contato - Terra Média</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

<h1 id="titulo_principal">Envie sua mensagem à Terra Média</h1>
<p>Use o formulário abaixo para enviar sua mensagem ao Conselho de Elrond.</p>

<form action="" method="post">
  <label>Seu nome (como é conhecido na Terra Média):</label>
  <input type="text" placeholder="Ex: Aragorn, filho de Arathorn"><br><br>

  <label>Seu e-mail (para resposta dos magos):</label>
  <input type="email" placeholder="seuemail@valfenda.com"><br><br>

  <label>Ano de nascimento (para definir sua era):</label>
  <input type="number"><br><br>

  <label>Telefone (ou forma de contato do Condado):</label>
  <input type="tel"><br><br>

  <label>Seu reino ou site (caso possua):</label>
  <input type="url" placeholder="https://meureino.com"><br><br>

  <label>Senha secreta (para acessar os portões de Moria):</label>
  <input type="password"><br><br>

  <label>Envie um artefato ou mensagem (arquivo):</label>
  <input type="file"><br><br>

  <label>Escolha a cor do seu estandarte:</label>
  <input type="color"><br><br>

  <label>Data de nascimento (na Terra Média):</label>
  <input type="date"><br><br>

  <label>Data e hora da sua jornada:</label>
  <input type="datetime-local"><br><br>

  <label>Hora preferida para encontros do conselho:</label>
  <input type="time"><br><br>

  <label>Mês de sua jornada:</label>
  <input type="month"><br><br>

  <label>Semana da missão:</label>
  <input type="week"><br><br>

  <label>Buscar personagem ou local:</label>
  <input type="search" placeholder="Ex: Frodo, Mordor, Gandalf">

  <br><br>

  <button type="reset">Limpar pergaminho</button>
  <button type="submit">Enviar mensagem</button>
</form>

</body>
</html>
